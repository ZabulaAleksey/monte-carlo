<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MonteCarlo · Setup</title>
  <style>
    :root{color-scheme:light;--ink:#102c23;--muted:#62716b;--green:#175c45;--lime:#c9f26b;--line:#dfe6df;--panel:#fff}
    *{box-sizing:border-box}body{margin:0;background:#f2f5f1;color:var(--ink);font:15px/1.65 Inter,Segoe UI,sans-serif}
    header,main{width:min(1040px,calc(100% - 32px));margin:auto}header{padding:48px 0 24px;display:flex;justify-content:space-between;gap:24px}
    .brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--green);color:var(--lime);font-weight:800}
    .languages{display:flex;gap:7px}.languages button{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:#fff;font-size:20px;cursor:pointer}.languages button.active{outline:3px solid var(--lime)}
    .hero{padding:42px;border-radius:20px;background:radial-gradient(circle at 90% 10%,rgba(201,242,107,.5),transparent 34%),#fff;border:1px solid var(--line)}
    .hero span{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{max-width:750px;margin:12px 0;font-size:clamp(34px,6vw,66px);line-height:1;letter-spacing:-.05em}.hero p{max-width:680px;color:var(--muted)}
    .steps{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:16px 0 48px}.step{padding:24px;border:1px solid var(--line);border-radius:14px;background:#fff}.step b{display:inline-grid;width:28px;height:28px;place-items:center;border-radius:50%;background:var(--lime)}.step h2{margin:14px 0 5px;font-size:18px}.step p{color:var(--muted)}code{display:block;overflow:auto;padding:11px;border-radius:8px;background:#102c23;color:#dbf4e8;font:12px Consolas,monospace}
    .note{margin:0 0 48px;padding:18px;border-left:4px solid #d89a2b;background:#fff8e8}.hidden{display:none}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.hero{padding:26px}.steps{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="brand"><span class="mark">MC</span><div><strong>MonteCarlo</strong><br><small id="tagline"></small></div></div><div class="languages"><button data-locale="en" aria-label="English">🇬🇧</button><button data-locale="ru" aria-label="Русский">🇷🇺</button><button data-locale="uk" aria-label="Українська">🇺🇦</button><button data-locale="be" aria-label="Беларуская">🇧🇾</button></div></header>
  <main><section class="hero"><span id="eyebrow"></span><h1 id="title"></h1><p id="description"></p></section><section class="steps" id="steps"></section><aside class="note" id="note"></aside></main>
  <script>
    const messages={
      en:{tagline:"Trading intelligence",eyebrow:"Offline setup guide",title:"Start the platform in five clear steps.",description:"This standalone page works even when Docker, the backend and MetaTrader 5 are stopped. Keep this file bookmarked for recovery.",note:"A web application cannot be served when every Docker container is stopped. This page is intentionally self-contained and can be opened directly from apps/frontend/public/offline/index.html.",steps:[["Start Docker","Open Docker Desktop, wait for the engine, then start the project.","docker compose up -d --build"],["Apply migrations","Create or update PostgreSQL tables.","docker compose exec backend alembic upgrade head"],["Open the website","Wait until containers are healthy.","http://localhost:3000"],["Connect MetaTrader 5","Compile and attach the bridge Expert Advisor, then allow WebRequest.","MQL5/Experts/MonteCarloBridge.mq5"],["Verify data","Open Market Data and confirm MT5 candles and Bid/Ask.","http://localhost:3000/market-data"],["Run research","Choose a cached period and start the deterministic test.","http://localhost:3000/strategies"]]},
      ru:{tagline:"Торговая аналитика",eyebrow:"Автономная инструкция",title:"Запустите платформу за пять понятных шагов.",description:"Эта автономная страница работает, даже когда Docker, backend и MetaTrader 5 остановлены. Сохраните её в закладки для восстановления.",note:"Сайт невозможно раздавать по HTTP, когда остановлены все Docker-контейнеры. Поэтому эта страница автономна и открывается напрямую из apps/frontend/public/offline/index.html.",steps:[["Запустите Docker","Откройте Docker Desktop, дождитесь запуска движка и поднимите проект.","docker compose up -d --build"],["Примените миграции","Создайте или обновите таблицы PostgreSQL.","docker compose exec backend alembic upgrade head"],["Откройте сайт","Дождитесь здорового состояния контейнеров.","http://localhost:3000"],["Подключите MetaTrader 5","Скомпилируйте и подключите советник-мост, затем разрешите WebRequest.","MQL5/Experts/MonteCarloBridge.mq5"],["Проверьте данные","Откройте Рынок и проверьте свечи MT5 и Bid/Ask.","http://localhost:3000/market-data"],["Запустите исследование","Выберите кешированный период и запустите воспроизводимый тест.","http://localhost:3000/strategies"]]},
      uk:{tagline:"Торгова аналітика",eyebrow:"Автономна інструкція",title:"Запустіть платформу за п’ять зрозумілих кроків.",description:"Ця автономна сторінка працює, навіть коли Docker, backend і MetaTrader 5 зупинені. Збережіть її в закладках.",note:"Сайт неможливо віддавати через HTTP, коли всі Docker-контейнери зупинені. Тому ця сторінка автономна й відкривається безпосередньо з apps/frontend/public/offline/index.html.",steps:[["Запустіть Docker","Відкрийте Docker Desktop, дочекайтеся рушія та запустіть проєкт.","docker compose up -d --build"],["Застосуйте міграції","Створіть або оновіть таблиці PostgreSQL.","docker compose exec backend alembic upgrade head"],["Відкрийте сайт","Дочекайтеся справного стану контейнерів.","http://localhost:3000"],["Під’єднайте MetaTrader 5","Скомпілюйте та під’єднайте радник-міст, потім дозвольте WebRequest.","MQL5/Experts/MonteCarloBridge.mq5"],["Перевірте дані","Відкрийте Ринок і перевірте свічки MT5 та Bid/Ask.","http://localhost:3000/market-data"],["Запустіть дослідження","Виберіть кешований період і запустіть відтворюваний тест.","http://localhost:3000/strategies"]]},
      be:{tagline:"Гандлёвая аналітыка",eyebrow:"Аўтаномная інструкцыя",title:"Запусціце платформу за пяць зразумелых крокаў.",description:"Гэта аўтаномная старонка працуе, нават калі Docker, backend і MetaTrader 5 спыненыя. Захавайце яе ў закладках.",note:"Сайт немагчыма аддаваць праз HTTP, калі ўсе Docker-кантэйнеры спыненыя. Таму гэта старонка аўтаномная і адкрываецца непасрэдна з apps/frontend/public/offline/index.html.",steps:[["Запусціце Docker","Адкрыйце Docker Desktop, дачакайцеся рухавіка і запусціце праект.","docker compose up -d --build"],["Ужыйце міграцыі","Стварыце або абнавіце табліцы PostgreSQL.","docker compose exec backend alembic upgrade head"],["Адкрыйце сайт","Дачакайцеся спраўнага стану кантэйнераў.","http://localhost:3000"],["Падключыце MetaTrader 5","Скампілюйце і падключыце дарадцу-мост, потым дазвольце WebRequest.","MQL5/Experts/MonteCarloBridge.mq5"],["Праверце даныя","Адкрыйце Рынак і праверце свечкі MT5 ды Bid/Ask.","http://localhost:3000/market-data"],["Запусціце даследаванне","Выберыце кэшаваны перыяд і запусціце ўзнаўляльны тэст.","http://localhost:3000/strategies"]]}
    };
    const storage="montecarlo.locale.v1";const locale=()=>messages[localStorage.getItem(storage)]?localStorage.getItem(storage):"en";
    function render(next){localStorage.setItem(storage,next);document.documentElement.lang=next;const m=messages[next];["tagline","eyebrow","title","description","note"].forEach(k=>document.getElementById(k).textContent=m[k]);document.getElementById("steps").innerHTML=m.steps.map((s,i)=>`<article class="step"><b>${i+1}</b><h2>${s[0]}</h2><p>${s[1]}</p><code>${s[2]}</code></article>`).join("");document.querySelectorAll("[data-locale]").forEach(b=>b.classList.toggle("active",b.dataset.locale===next));}
    document.querySelectorAll("[data-locale]").forEach(b=>b.onclick=()=>render(b.dataset.locale));render(locale());
  </script>
</body>
</html>
